name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e '.[dev]'
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e '.[dev]'
      - run: pytest --cov=traderstack --cov-report=term-missing --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      # Upgrade the runner's own pip/setuptools first: pip-audit audits the whole
      # resolved environment, and a stale runner pip carries advisories that would
      # keep this gate permanently red regardless of the project's dependencies.
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e '.[dev]'
      - name: pip-audit (resolved environment)
        run: pip-audit --skip-editable --progress-spinner off
      - name: bandit (static security lint)
        run: bandit -r src -ll

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: traderstack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
