services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: traderstack
      POSTGRES_USER: traderstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderstack -d traderstack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]

  app:
    build: .
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    # Metrics bind 0.0.0.0 INSIDE the container so the prometheus service can
    # scrape it over the compose network; the host publish stays on loopback.
    command: ["traderstack-paper", "--persistent-events", "--checkpoint-path", "/app/var/state/portfolio.json", "--audit-path", "/app/var/audit/runtime.jsonl", "--ledger-path", "/app/var/state/ledger.json", "--metrics-addr", "0.0.0.0"]
    ports: ["127.0.0.1:9108:9108"]
    volumes: ["app_state:/app/var"]
    restart: unless-stopped
    profiles: ["app"]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    ports: ["127.0.0.1:3000:3000"]
    profiles: ["observability"]

volumes:
  postgres_data:
  redis_data:
  app_state:
