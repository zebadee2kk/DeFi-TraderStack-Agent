services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: traderstack
      POSTGRES_USER: traderstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderstack -d traderstack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  app:
    build: .
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["traderstack-paper", "--persistent-events", "--checkpoint-path", "/app/var/state/portfolio.json", "--audit-path", "/app/var/audit/runtime.jsonl"]
    ports: ["9108:9108"]
    volumes: ["app_state:/app/var"]
    restart: unless-stopped
    profiles: ["app"]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["observability"]

  # --- Loki logs (Epic 9), observability profile only ---
  loki:
    image: grafana/loki:latest
    ports: ["3100:3100"]
    volumes: ["loki_data:/loki"]
    profiles: ["observability"]

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./ops/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/promtail.yml"]
    depends_on:
      - loki
    profiles: ["observability"]
  # --- end Loki logs (Epic 9) ---

volumes:
  postgres_data:
  redis_data:
  app_state:
  grafana_data:
  loki_data:
