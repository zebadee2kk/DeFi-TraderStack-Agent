[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defi-traderstack-agent"
version = "0.1.0"
description = "Event-driven agentic crypto research, risk and execution platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "lz4>=4.3",
  "websockets>=13.0",
  "structlog>=24.1",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "bandit>=1.7",
]
# Optional OpenTelemetry tracing (Epic 9). traderstack.tracing is a no-op
# whenever this extra is not installed, so it is never required at runtime.
opentelemetry = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
]

[project.scripts]
traderstack-paper = "traderstack.cli:main"
traderstack-trace = "traderstack.trace_cli:main"
# Operator kill switch, usable without the trading process or the LLM runtime:
# both entry points only create/remove the sentinel file.
traderstack-kill = "traderstack.killswitch:kill_main"
traderstack-resume = "traderstack.killswitch:resume_main"
traderstack-research = "traderstack.research.cli:main"
traderstack-strategy-search = "traderstack.research.search_cli:main"
traderstack-download-candles = "traderstack.research.download_candles:main"
# Miles-inspired EMA/ADX × GARCH search. Offline/batch; never enables live
# and never overwrites traderstack-strategy-search (#89 catalog).
traderstack-miles-search = "traderstack.research.miles_cli:main"
# Daily robustness / balanced-holdout: Kraken 720-bar daily + optional Yahoo
# A/B. Offline/batch; never enables PAPER_PROMOTE_* flags.
traderstack-daily-robustness = "traderstack.research.daily_robustness_cli:main"
# Harder honesty gates on the expanded daily catalog: magnitude
# balance, 3x240-bar multi-window, 2x fee stress. Ranks combined-passers
# by mean holdout excess. Offline/batch; never flips PAPER_PROMOTE_*.
# An empty promotee is success.
traderstack-harder-gates = "traderstack.research.harder_gates_cli:main"
# Honesty pack for one combined-passer (default ema_9_21_adx15).
# Offline/batch; never flips PAPER_PROMOTE_* flags.
traderstack-honesty-pack = "traderstack.research.honesty_pack_cli:main"
# Second independent print for ema_9_21_adx15: Kraken holdout-blind
# prefix + Binance Spot daily older 720. Report-only; never flips
# PAPER_PROMOTE_*. An honest FAIL is success.
traderstack-second-print = "traderstack.research.second_print_cli:main"
# Dual-print daily search: expanded catalog must clear Kraken primary
# harder combined gates AND the #102 Binance.US older-720. Ranking is
# Kraken mean HO among dual-print passers. Never flips PAPER_PROMOTE_*.
# An empty dual-print set is success.
traderstack-dual-print-search = "traderstack.research.dual_print_search_cli:main"
# Liquidation / regime-conditioned search after the empty #104 dual-print
# EMA catalog. Dual-print only if a historical liquidation series exists;
# otherwise Kraken-only single-print and cannot promote. Never flips
# PAPER_PROMOTE_*. Empty search is success. No live.
traderstack-liq-regime-search = "traderstack.research.liq_regime_search_cli:main"
# 4h/1h dual-print after empty daily EMA (#104), empty liq (#105), and
# empty Polymarket PIT (#106). Frozen non-EMA catalog; #96+A+B+C on
# Kraken Spot and the #102-style Binance.US older-720. Never flips
# PAPER_PROMOTE_*. Empty dual-print set is success. No live.
traderstack-intraday-dual-print = "traderstack.research.intraday_dual_print_cli:main"
# Funding-z threshold + hedged-carry search. Dual-print only if two
# independent funding venues cover BTC+ETH; 1d resamples to UTC daily
# sums; PIT basis probed skip-not-invent (HL REST current-only; HTX
# mark−index is one venue; BitMEX sunset 23 September 2026 04:00 UTC);
# paper perp stub cannot promote; otherwise single-print and cannot
# promote. Never flips PAPER_PROMOTE_*. Empty search is success.
traderstack-funding-carry = "traderstack.research.funding_carry_cli:main"
traderstack-funding-div = "traderstack.research.funding_div_cli:main"
traderstack-sess-gap = "traderstack.research.session_gap_cli:main"
traderstack-vol-target = "traderstack.research.vol_target_cli:main"
# DefiLlama stablecoin net-issuance SPOT overlay. Live history is NOT
# PIT-safe (no as_of; revisions overwrite). Dual-print refuses without a
# pit_safe operator archive. Never flips PAPER_PROMOTE_*. UNAVAILABLE /
# empty dual-print is success. No live.
traderstack-stable-net-issuance = "traderstack.research.stable_net_issuance_cli:main"
# Operator-dated DefiLlama stablecoin chart snapshots (PIT tip archive).
# as_of = fetch UTC day; immutable dirs + tips.jsonl. Dual-print still
# refused until >=720 tip days. Never flips PAPER_PROMOTE_*. No live score.
traderstack-defillama-stable-snapshot = "traderstack.research.defillama_stable_snapshot_cli:main"
# BTC−ETH residual fade/follow at frozen |z| thresholds. Same #96+A+B+C
# dual-print bar as #104 (Kraken 720 + Binance.US older-720). Paper
# spot executable. Never flips PAPER_PROMOTE_*. Empty dual-print is
# success. Not an EMA reprint and not a carry/basis family.
traderstack-relative-value = "traderstack.research.relative_value_cli:main"
# BTC+ETH+SOL cross-sectional momentum (long top-1 / optional short
# bottom-1) at frozen N in {21, 63, 126}. Same #96+A+B+C dual-print
# bar as #104 (Kraken 720 + Binance.US older-720). SOL reported, not
# a gate. Paper spot executable. Never flips PAPER_PROMOTE_*. Empty
# dual-print is success. Not an EMA or residual reprint.
traderstack-xs-momentum = "traderstack.research.cross_sectional_momentum_cli:main"
# Donchian / channel-breakout at frozen N in {20, 55, 100} (optional
# ATR-14 buffer on lo 20/55). Same #96+A+B+C dual-print bar as #104
# (Kraken 720 + Binance.US older-720). SOL reported, not a gate.
# Paper spot executable. Never flips PAPER_PROMOTE_*. Empty
# dual-print is success. Not an EMA / residual / XS reprint.
traderstack-donchian-breakout = "traderstack.research.donchian_breakout_cli:main"
# Own-asset time-series momentum at frozen N in {21, 63, 126, 252}
# (long-only / long-short). Same #96+A+B+C dual-print bar as #104
# (Kraken 720 + Binance.US older-720). SOL reported, not a gate.
# Paper spot executable. Never flips PAPER_PROMOTE_*. Empty
# dual-print is success. Not an EMA / residual / XS / Donchian reprint.
traderstack-tsmom = "traderstack.research.tsmom_cli:main"
# Bollinger band-fade / mean-reversion at frozen period×k
# {20x2, 20x2.5, 40x2} (fade / long-only fade / squeeze contrast).
# Same #96+A+B+C dual-print bar as #104 (Kraken 720 + Binance.US
# older-720). SOL reported, not a gate. Paper spot executable.
# Never flips PAPER_PROMOTE_*. Empty dual-print is success. Not an
# EMA / residual / XS / Donchian / TSMOM / mean_reversion_* reprint.
traderstack-bollinger-fade = "traderstack.research.bollinger_fade_cli:main"
# UTC calendar seasonality (DOW / MOY / turn-of-month). Same
# #96+A+B+C dual-print bar as #104 (Kraken 720 + Binance.US
# older-720). SOL reported, not a gate. Paper spot executable.
# Never flips PAPER_PROMOTE_*. Empty dual-print is success. Not
# an EMA / residual / XS / Donchian / TSMOM / Bollinger reprint.
traderstack-calendar-seasonality = "traderstack.research.calendar_seasonality_cli:main"
# BTC→ETH lead-lag (ETH follows lagged BTC L-day return; not
# #116 residual z-score). Same #96+A+B+C dual-print bar as #104
# (Kraken 720 + Binance.US older-720). Other leg frozen flat.
# Paper spot executable. Never flips PAPER_PROMOTE_*. Empty
# dual-print is success. Not an EMA / residual / XS / Donchian /
# TSMOM / Bollinger / calendar reprint.
traderstack-lead-lag = "traderstack.research.lead_lag_cli:main"
# Volume-confirmed breakout (price breakout AND volume gate; not a
# Donchian N retune). Same #96+A+B+C dual-print bar as #104
# (Kraken 720 + Binance.US older-720). SOL reported, not a gate.
# Paper spot executable. Never flips PAPER_PROMOTE_*. Empty
# dual-print is success. Not an EMA / residual / XS / Donchian /
# TSMOM / Bollinger / calendar / lead-lag reprint.
traderstack-volume-breakout = "traderstack.research.volume_breakout_cli:main"
traderstack-check-config = "traderstack.cli_check:main"
# Paper-trading acceptance (Epic 10): the soak runner and the paper
# performance-versus-baselines report. Both are offline by construction.
traderstack-soak = "traderstack.acceptance.soak:main"
traderstack-paper-report = "traderstack.acceptance.report:main"
# Zero-trade diagnosis (#131): rebuild the opportunity funnel from a run's
# audit/runtime.jsonl (+ optional ledger). Offline; evidence only.
traderstack-opportunity-funnel = "traderstack.funnel_cli:main"
# Verifies the risk-audit hash chain AND cross-checks it against the chain
# heads anchored outside the file (#68), so a regenerate-from-genesis rewrite
# is detectable rather than self-consistent. Offline and read-only.
traderstack-verify-audit = "traderstack.audit_verify_cli:main"
# Paper-only Polymarket weather research. Isolated from traderstack-paper;
# never signs or submits CLOB orders.
traderstack-polymarket-weather-paper = "traderstack.polymarket.cli:main"
# Fee-aware evaluation of the #44 weather rule. Report-only; dual
# independent prints required before anyone may talk about promotion.
# Never flips PAPER_PROMOTE_*. Empty / negative is success. No CLOB orders.
traderstack-polymarket-weather-eval = "traderstack.polymarket.eval_cli:main"
# On-chain regime overlay (#139): frozen MVRV-Z percentile / NUPL overlays
# (Coin Metrics community, BTC series) on the frozen TSMOM catalog; two
# prints (Kraken 720 + Binance.US older-720); skip-not-invent; never flips
# PAPER_PROMOTE_*; empty overlay set is success; no live.
traderstack-onchain-regime = "traderstack.research.onchain_regime_cli:main"
# Long-only top-k cross-sectional momentum on the point-in-time Kraken USD
# spot universe (#140): N in {21,63,126}, 7-day skip, k in {3,5}, ew/iv,
# weekly. Portfolio bar with era prints; turnover and fee drag at research
# and pilot-tier costs; ew_bh_universe control cannot promote. Never flips
# PAPER_PROMOTE_*. Empty dual-print set is success. No live.
traderstack-xs-topk = "traderstack.research.xs_topk_cli:main"
# Ensemble trend (#137): multi-lookback Donchian-on-close {5..360} +
# trailing midpoint stop + 25% vol target on a frozen top-20 PIT
# Kraken universe. Same #96+A+B+C dual-print bar as #104 (Kraken 720
# + Binance.US older-720). SOL reported, not a gate. Kraken Pro tier
# fees. Era prints / DSR / PBO reported unavailable until #133/#135.
# Paper spot executable (long-only). Never flips PAPER_PROMOTE_*.
# Empty dual-print is success. Not a #118 Donchian N retune.
traderstack-ensemble-trend = "traderstack.research.ensemble_trend_cli:main"
# Second-venue PIT basis (#134): OKX history-mark-price-candles − history-index-candles
# and Binance Vision markPriceKlines − indexPriceKlines (sha256-verified) daily
# mark−index into [{opened_at, value}] JSON for traderstack-funding-carry --basis-dir.
# Skip-not-invent; premium / last-trade / funding-implied refused; empty is success. No live.
traderstack-download-basis = "traderstack.research.basis_cli:main"
# Paper-only point-in-time tape of Polymarket BTC/ETH threshold mids vs a
# Deribit option-implied probability (#142). GET-only Gamma/CLOB/Deribit
# public endpoints; never signs, never submits, never touches the crypto
# paper loop. Crucix high-tier alerts are recorded as stand-aside and can
# only withhold. Never flips PAPER_PROMOTE_*. An empty tape is success.
traderstack-polymarket-crypto-collect = "traderstack.polymarket.crypto_cli:main"
# Fee-aware evaluation of the #142 wedge tape (slice-2). Report-only;
# never invents settlements; never flips PAPER_PROMOTE_*. Empty is success.
traderstack-polymarket-crypto-eval = "traderstack.polymarket.crypto_eval_cli:main"
# Point-in-time Polymarket weather tape (#141). Observations only: the
# collector appends decision-time book + as-issued forecast, the resolver
# pairs them with an official station high. No intents, no CLOB orders.
traderstack-polymarket-weather-collect = "traderstack.polymarket.collect_cli:main"
traderstack-polymarket-weather-resolve = "traderstack.polymarket.resolve_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traderstack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]

# lz4 (asiletto81 HL asset_ctxs decompression in research.edge_series) ships
# no stubs or py.typed marker; nothing else in the tree imports it.
[[tool.mypy.overrides]]
module = ["lz4", "lz4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
