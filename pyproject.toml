[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defi-traderstack-agent"
version = "0.1.0"
description = "Event-driven agentic crypto research, risk and execution platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "websockets>=13.0",
  "structlog>=24.1",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
# Optional OpenTelemetry tracing (Epic 9). traderstack.tracing is a no-op
# whenever this extra is not installed, so it is never required at runtime.
opentelemetry = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
]

[project.scripts]
traderstack-paper = "traderstack.cli:main"
traderstack-trace = "traderstack.trace_cli:main"
# Operator kill switch, usable without the trading process or the LLM runtime:
# both entry points only create/remove the sentinel file.
traderstack-kill = "traderstack.killswitch:kill_main"
traderstack-resume = "traderstack.killswitch:resume_main"
traderstack-research = "traderstack.research.cli:main"
traderstack-download-candles = "traderstack.research.download_candles:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traderstack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
